<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪客快打4：枪林弹雨</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="eyebrow">CRAZY FLASHER 4</span><h1>闪客快打4 <span>枪林弹雨</span></h1></div><div class="balance">鲸鲸币 <strong id="balance">—</strong><small>1 币 = 10 游戏金钱</small></div></header>
<section class="toolbar" aria-label="游戏操作"><button id="continue" disabled>开始游戏</button><button id="pause" disabled>暂停</button><button id="save" disabled>保存进度</button><button id="sound" disabled>声音：开</button><button id="recharge" disabled>鲸鲸币充值</button><button id="retry" hidden>重试未确认请求</button><span id="money">游戏金钱 —</span></section>
<main id="stage" aria-label="游戏画面"><div id="loading">正在准备原版游戏…</div></main>
<footer><p id="status" role="status" aria-live="polite">正在连接游戏中心…</p><p>WASD 移动 · 鼠标瞄准射击 · R 换弹 · 1–4 换武器 · E 切换商店 · B 选关<span>每 5 秒自动保存；暂停时保存当前关卡、角色位置、生命、敌人、装备与金钱。</span></p></footer>
<dialog id="exchange"><section><h2>鲸鲸币充值</h2><p>1 鲸鲸币兑换 10 游戏金钱，到账后可在原版商店购买装备。</p><label>兑换数量 <input id="amount" type="number" min="1" max="10000" step="1" value="1"></label><p id="quote">消耗 1 鲸鲸币，获得 10 游戏金钱</p><p id="exchange-status" role="status" aria-live="polite"></p><div class="actions"><button id="cancel">取消</button><button type="button" id="confirm">确认兑换</button></div></section></dialog>
<!--ASSETS--><script src="game.js"></script><script src="core.js"></script><script src="ruffle.js"></script>
</body></html>
